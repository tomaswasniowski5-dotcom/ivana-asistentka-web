<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Masérna – rezervace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fbf7f0;
    --linen: #f4ece0;
    --sand: #e9dcc8;
    --line: #ece3d6;
    --line-strong: #dccdb7;
    --espresso: #2c221b;
    --ink: #3a2f26;
    --muted: #74665a;
    --gold: #b08a52;
    --gold-deep: #8e6c3c;
    --now: #c0392b;
    --hour: 48px;
    --gutter: 56px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Manrope, system-ui, sans-serif;
    color: var(--ink);
    background: var(--cream);
    display: flex; flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---------- horní lišta ---------- */
  .bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: var(--cream);
  }
  .brand { font-family: Marcellus, serif; font-size: 22px; color: var(--espresso); margin-right: 8px; white-space: nowrap; }
  .btn {
    border: 1px solid var(--line-strong); background: #fff; border-radius: 999px;
    padding: 7px 16px; font-weight: 600; font-size: 14px;
  }
  .btn:hover { background: var(--linen); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent;
    display: inline-grid; place-items: center; font-size: 20px; color: var(--muted);
  }
  .icon-btn:hover { background: var(--linen); color: var(--espresso); }
  .range { font-size: 19px; font-weight: 600; color: var(--espresso); white-space: nowrap; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; font-weight: 600; font-size: 14px; }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.on { background: var(--espresso); color: var(--cream); }
  .btn-primary { background: var(--espresso); color: var(--cream); border-color: var(--espresso); }
  .btn-primary:hover { background: #45362b; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 16px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); align-items: center; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: -1px; }
  .demo { background: #fff4d6; color: #6b5310; padding: 6px 16px; font-size: 13px; border-bottom: 1px solid #f0dfa8; }
  .demo:empty { display: none; }

  /* ---------- časová mřížka (den / týden) ---------- */
  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tg-head { display: flex; border-bottom: 1px solid var(--line); background: var(--cream); padding-right: var(--sbw, 0px); }
  .tg-head .gut { width: var(--gutter); flex: none; }
  .dh { flex: 1; min-width: 0; text-align: center; padding: 8px 0 10px; cursor: pointer; border-left: 1px solid transparent; }
  .dh .wd { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .dh .dn { font-size: 24px; width: 42px; height: 42px; line-height: 42px; margin: 2px auto 0; border-radius: 50%; color: var(--espresso); }
  .dh.today .wd { color: var(--gold-deep); }
  .dh.today .dn { background: var(--gold); color: #fff; }
  .dh:hover .dn { background: var(--linen); }
  .dh.today:hover .dn { background: var(--gold-deep); }

  .tg-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
  .tg-body { display: flex; position: relative; height: calc(var(--hour) * 24); user-select: none; -webkit-user-select: none; }
  .tg-body .gut { width: var(--gutter); flex: none; position: relative; }
  .hl { position: absolute; right: 8px; font-size: 11px; color: var(--muted); transform: translateY(-50%); }
  .col { flex: 1; min-width: 0; position: relative; border-left: 1px solid var(--line);
    background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px);
    background-size: 100% var(--hour);
  }
  .col.past { background-color: rgba(233, 220, 200, .18); }
  .col.today { background-color: rgba(176, 138, 82, .05); }

  .ev {
    position: absolute; left: 2px; right: 6px; border-radius: 6px; padding: 3px 7px;
    color: #fff; font-size: 12px; line-height: 1.3; overflow: hidden; cursor: grab;
    box-shadow: 0 0 0 1px rgba(255,255,255,.9); touch-action: none;
  }
  .ev:active { cursor: grabbing; }
  .ev .who { font-weight: 700; }
  .ev .when, .ev .note { opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.short { padding-top: 1px; padding-bottom: 1px; }
  .ev.short .who, .ev.short .when { display: inline; }
  .ev.short .when { margin-left: 4px; }
  .ev.dragging { opacity: .85; box-shadow: 0 6px 18px rgba(44,34,27,.3); z-index: 5; }
  .ev .rs { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; cursor: ns-resize; }
  .ghost { position: absolute; left: 2px; right: 6px; border-radius: 6px; background: rgba(44,34,27,.18); border: 1px dashed var(--espresso); font-size: 12px; padding: 3px 7px; color: var(--espresso); font-weight: 600; pointer-events: none; }

  .now { position: absolute; left: -1px; right: 0; height: 2px; background: var(--now); z-index: 4; pointer-events: none; }
  .now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }

  /* ---------- měsíc ---------- */
  .mh { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--line); }
  .mh div { text-align: center; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 0; }
  .mg { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; min-height: 0; overflow-y: auto; }
  .mc { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; min-height: 92px; overflow: hidden; cursor: pointer; }
  .mc.other { background: rgba(233, 220, 200, .25); }
  .mc.other .md { color: var(--muted); opacity: .7; }
  .md { font-size: 13px; font-weight: 600; text-align: center; width: 26px; height: 26px; line-height: 26px; margin: 0 auto 2px; border-radius: 50%; }
  .mc.today .md { background: var(--gold); color: #fff; }
  .chip { display: block; width: 100%; text-align: left; border: 0; border-radius: 4px; color: #fff; font-size: 12px; padding: 2px 6px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more { font-size: 12px; color: var(--muted); padding: 2px 6px; }

  /* ---------- modal ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(44,34,27,.35); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .backdrop.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 420px; padding: 20px 22px; box-shadow: 0 20px 60px rgba(44,34,27,.3); max-height: 100%; overflow-y: auto; }
  .modal h2 { font-family: Marcellus, serif; font-weight: 400; font-size: 22px; margin: 0 0 16px; color: var(--espresso); }
  .lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 14px 0 6px; }
  .people { display: flex; flex-wrap: wrap; gap: 8px; }
  .person { border: 2px solid var(--line-strong); background: #fff; border-radius: 999px; padding: 6px 14px 6px 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
  .person .dot { width: 12px; height: 12px; border-radius: 50%; }
  .person.on { color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=date], input[type=time], input[type=text] {
    font: inherit; font-size: 15px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; background: #fff; color: var(--ink);
  }
  input[type=text] { width: 100%; }
  input:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
  .err { color: var(--now); font-size: 14px; margin-top: 12px; min-height: 0; }
  .err:empty { display: none; }
  .actions { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
  .btn-danger { color: var(--now); border-color: #e9c3bd; }
  .btn-danger:hover { background: #fbeceb; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--espresso); color: var(--cream); padding: 10px 18px; border-radius: 10px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 60; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .fab { display: none; }
  @media (max-width: 700px) {
    .brand { font-size: 18px; width: 100%; }
    .range { font-size: 16px; }
    .bar { gap: 6px; padding: 10px 12px; }
    .bar .add-desktop { display: none; }
    :root { --gutter: 44px; --hour: 52px; }
    .dh .dn { font-size: 18px; width: 34px; height: 34px; line-height: 34px; }
    .mc { min-height: 64px; padding: 2px; }
    .chip { font-size: 10px; padding: 1px 3px; }
    .fab { display: grid; place-items: center; position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--espresso); color: var(--cream); font-size: 28px; box-shadow: 0 8px 24px rgba(44,34,27,.35); z-index: 20; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">Masérna · rezervace</div>
  <button class="btn" id="today">Dnes</button>
  <button class="icon-btn" id="prev" aria-label="Předchozí">‹</button>
  <button class="icon-btn" id="next" aria-label="Další">›</button>
  <div class="range" id="range"></div>
  <div class="spacer"></div>
  <div class="seg" id="views">
    <button data-v="day">Den</button><button data-v="week">Týden</button><button data-v="month">Měsíc</button>
  </div>
  <button class="btn btn-primary add-desktop" id="add">+ Rezervovat</button>
</header>
<div class="demo" id="demo"></div>
<div class="legend" id="legend"></div>
<main class="main" id="main"></main>
<button class="fab" id="fab" aria-label="Rezervovat">+</button>

<div class="backdrop" id="backdrop">
  <form class="modal" id="form" autocomplete="off">
    <h2 id="mtitle">Nová rezervace</h2>
    <div class="lbl">Kdo si masérnu bere</div>
    <div class="people" id="mpeople"></div>
    <div class="lbl">Kdy</div>
    <div class="row">
      <input type="date" id="mdate" required>
      <input type="time" id="mfrom" step="900" required>
      <span>–</span>
      <input type="time" id="mto" step="900" required>
    </div>
    <div class="lbl">Poznámka (nepovinné)</div>
    <input type="text" id="mnote" maxlength="80" placeholder="např. klientka, úklid…">
    <div class="err" id="merr"></div>
    <div class="actions">
      <button type="button" class="btn btn-danger" id="mdel">Smazat</button>
      <div class="spacer"></div>
      <button type="button" class="btn" id="mcancel">Zrušit</button>
      <button type="submit" class="btn btn-primary">Uložit</button>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
(() => {
  const CFG = window.MASERNA_CONFIG || {};
  const PEOPLE = CFG.people || [];
  const SNAP = 15;               // minuty
  const DAY_MIN = 24 * 60;
  const $ = (id) => document.getElementById(id);

  // ---------- datumy ----------
  const sod = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const sow = (d) => { const x = sod(d); return addDays(x, -((x.getDay() + 6) % 7)); }; // pondělí
  const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const minsOf = (d) => d.getHours() * 60 + d.getMinutes();
  const atMin = (day, m) => { const x = sod(day); x.setMinutes(m); return x; };
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const hm = (d) => `${d.getHours()}:${pad(d.getMinutes())}`;
  const hmInput = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmt = (d, o) => new Intl.DateTimeFormat("cs-CZ", o).format(d);
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  const colorOf = (name) => (PEOPLE.find((p) => p.name === name) || {}).color || "#8a7b6d";

  // ---------- úložiště ----------
  const remote = CFG.supabaseUrl && CFG.supabaseKey;
  const store = remote ? supabaseStore() : localStore();

  function supabaseStore() {
    const base = CFG.supabaseUrl.replace(/\/$/, "") + "/rest/v1/bookings";
    const headers = {
      apikey: CFG.supabaseKey,
      // legacy anon klíč (JWT) se posílá i jako Bearer, nový publishable klíč stačí v apikey
      ...(CFG.supabaseKey.startsWith("eyJ") ? { Authorization: "Bearer " + CFG.supabaseKey } : {}),
      "Content-Type": "application/json",
      Prefer: "return=representation",
    };
    async function call(url, opts = {}) {
      const r = await fetch(url, { ...opts, headers });
      if (!r.ok) {
        const body = await r.json().catch(() => ({}));
        const e = new Error(body.message || r.statusText);
        e.conflict = body.code === "23P01"; // porušení exclusion constraintu = překryv
        throw e;
      }
      return r.status === 204 ? null : r.json();
    }
    return {
      list: (from, to) => call(`${base}?select=*&starts_at=lt.${encodeURIComponent(to.toISOString())}&ends_at=gt.${encodeURIComponent(from.toISOString())}&order=starts_at`),
      create: (b) => call(base, { method: "POST", body: JSON.stringify(b) }).then((r) => r[0]),
      update: (id, b) => call(`${base}?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(b) }).then((r) => r[0]),
      remove: (id) => call(`${base}?id=eq.${id}`, { method: "DELETE" }),
    };
  }

  function localStore() {
    const KEY = "maserna-demo";
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
    const write = (a) => { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch {} };
    return {
      list: async (from, to) => read().filter((b) => new Date(b.starts_at) < to && new Date(b.ends_at) > from),
      create: async (b) => { const n = { ...b, id: crypto.randomUUID() }; write([...read(), n]); return n; },
      update: async (id, b) => { const a = read().map((x) => (x.id === id ? { ...x, ...b } : x)); write(a); return a.find((x) => x.id === id); },
      remove: async (id) => write(read().filter((x) => x.id !== id)),
    };
  }

  // ---------- stav ----------
  let view = localGet("maserna-view") || (innerWidth < 700 ? "day" : "week");
  if (innerWidth < 700 && view === "week") view = "day";
  let cursor = sod(new Date());
  let bookings = [];
  let busy = false;         // probíhá tažení – nepřekreslovat z pollingu
  let editing = null;       // upravovaná rezervace (null = nová)
  let lastScroll = null;

  function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

  function visibleRange() {
    if (view === "day") return [sod(cursor), addDays(sod(cursor), 1)];
    if (view === "week") { const s = sow(cursor); return [s, addDays(s, 7)]; }
    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const s = sow(first);
    return [s, addDays(s, 42)];
  }

  async function load() {
    const [from, to] = visibleRange();
    try {
      bookings = await store.list(from, to);
    } catch (e) {
      toast("Nepodařilo se načíst rezervace: " + e.message);
    }
    if (!busy) render();
  }

  function conflictWith(start, end, ignoreId) {
    return bookings.find((b) => b.id !== ignoreId && new Date(b.starts_at) < end && new Date(b.ends_at) > start);
  }

  function conflictMsg() {
    return "V tu dobu už je masérna rezervovaná.";
  }

  async function save(id, data) {
    try {
      if (id) {
        const u = await store.update(id, data);
        bookings = bookings.map((b) => (b.id === id ? u : b));
      } else {
        bookings.push(await store.create(data));
      }
      render();
      return true;
    } catch (e) {
      await load();
      toast(e.conflict ? conflictMsg() : "Uložení selhalo: " + e.message);
      return false;
    }
  }

  // ---------- vykreslení ----------
  function render() {
    for (const b of document.querySelectorAll("#views button")) b.classList.toggle("on", b.dataset.v === view);
    $("range").textContent = rangeLabel();
    const sc = document.querySelector(".tg-scroll");
    if (sc) lastScroll = sc.scrollTop;
    const main = $("main");
    main.innerHTML = "";
    if (view === "month") renderMonth(main); else renderGrid(main);
  }

  function rangeLabel() {
    if (view === "day") return cap(fmt(cursor, { weekday: "long", day: "numeric", month: "long", year: "numeric" }));
    if (view === "month") return cap(fmt(cursor, { month: "long", year: "numeric" }));
    const s = sow(cursor), e = addDays(s, 6);
    if (s.getMonth() === e.getMonth()) return `${s.getDate()}.–${fmt(e, { day: "numeric", month: "long", year: "numeric" })}`;
    return `${fmt(s, { day: "numeric", month: "long" })} – ${fmt(e, { day: "numeric", month: "long", year: "numeric" })}`;
  }

  function renderGrid(main) {
    const days = view === "day" ? [sod(cursor)] : [...Array(7)].map((_, i) => addDays(sow(cursor), i));
    const today = sod(new Date());

    const head = el("div", "tg-head");
    head.append(el("div", "gut"));
    for (const d of days) {
      const h = el("div", "dh" + (sameDay(d, today) ? " today" : ""));
      h.innerHTML = `<div class="wd">${fmt(d, { weekday: "short" })}</div><div class="dn">${d.getDate()}</div>`;
      h.onclick = () => { cursor = d; setView("day"); };
      head.append(h);
    }

    const scroll = el("div", "tg-scroll");
    const body = el("div", "tg-body");
    const gut = el("div", "gut");
    for (let h = 1; h < 24; h++) {
      const l = el("div", "hl");
      l.style.top = `calc(var(--hour) * ${h})`;
      l.textContent = `${h}:00`;
      gut.append(l);
    }
    body.append(gut);

    for (const d of days) {
      const col = el("div", "col" + (sameDay(d, today) ? " today" : d < today ? " past" : ""));
      col.dataset.date = ymd(d);
      layoutDay(d).forEach(({ b, lane, lanes }) => col.append(eventEl(b, lane, lanes)));
      if (sameDay(d, today)) {
        const n = el("div", "now");
        n.style.top = `calc(var(--hour) * ${minsOf(new Date()) / 60})`;
        col.append(n);
      }
      attachCreate(col);
      body.append(col);
    }
    scroll.append(body);
    main.append(head, scroll);

    // šířka scrollbaru, ať hlavička sedí na sloupce
    head.style.setProperty("--sbw", scroll.offsetWidth - scroll.clientWidth + "px");
    scroll.scrollTop = lastScroll ?? hourPx() * (CFG.dayStartHour ?? 7);
  }

  const hourPx = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour")) || 48;

  // Rozdělí překrývající se rezervace (pokud by nějaké byly) do sloupečků vedle sebe.
  function layoutDay(day) {
    const list = bookings
      .filter((b) => sameDay(new Date(b.starts_at), day))
      .sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
    const out = [];
    let cluster = [], clusterEnd = 0;
    const flush = () => {
      const laneEnds = [];
      for (const it of cluster) {
        let lane = laneEnds.findIndex((e) => e <= it.s);
        if (lane < 0) lane = laneEnds.length;
        laneEnds[lane] = it.e;
        it.lane = lane;
      }
      cluster.forEach((it) => out.push({ b: it.b, lane: it.lane, lanes: laneEnds.length }));
      cluster = [];
    };
    for (const b of list) {
      const s = minsOf(new Date(b.starts_at));
      const e = sameDay(new Date(b.ends_at), day) ? minsOf(new Date(b.ends_at)) : DAY_MIN;
      if (cluster.length && s >= clusterEnd) flush();
      cluster.push({ b, s, e });
      clusterEnd = Math.max(clusterEnd, e);
    }
    if (cluster.length) flush();
    return out;
  }

  function eventEl(b, lane = 0, lanes = 1) {
    const s = new Date(b.starts_at), e = new Date(b.ends_at);
    const ev = el("div", "ev");
    ev.dataset.id = b.id;
    ev.style.background = colorOf(b.person);
    if (lanes > 1) {
      ev.style.left = `calc(${(lane / lanes) * 100}% + 2px)`;
      ev.style.right = "auto";
      ev.style.width = `calc(${100 / lanes}% - 6px)`;
    }
    placeEvent(ev, minsOf(s), sameDay(s, e) ? minsOf(e) : DAY_MIN);
    ev.innerHTML = `<div class="who"></div><div class="when"></div><div class="note"></div><div class="rs"></div>`;
    fillEvent(ev, b.person, s, e, b.note);
    attachDrag(ev, b);
    return ev;
  }

  function placeEvent(ev, sMin, eMin) {
    ev.style.top = `calc(var(--hour) * ${sMin / 60})`;
    ev.style.height = `calc(var(--hour) * ${(eMin - sMin) / 60} - 2px)`;
    ev.classList.toggle("short", eMin - sMin <= 30);
  }

  function fillEvent(ev, person, s, e, note) {
    ev.querySelector(".who").textContent = person;
    ev.querySelector(".when").textContent = `${hm(s)}–${hm(e)}`;
    ev.querySelector(".note").textContent = note || "";
  }

  function renderMonth(main) {
    const [start] = visibleRange();
    const today = sod(new Date());
    const mh = el("div", "mh");
    for (let i = 0; i < 7; i++) mh.append(Object.assign(el("div"), { textContent: fmt(addDays(start, i), { weekday: "short" }) }));
    const mg = el("div", "mg");
    const maxChips = innerWidth < 700 ? 2 : 3;
    for (let i = 0; i < 42; i++) {
      const d = addDays(start, i);
      const c = el("div", "mc" + (d.getMonth() !== cursor.getMonth() ? " other" : "") + (sameDay(d, today) ? " today" : ""));
      c.append(Object.assign(el("div", "md"), { textContent: d.getDate() }));
      const list = bookings.filter((b) => sameDay(new Date(b.starts_at), d)).sort((a, b) => new Date(a.starts_at) - new Date(b.starts_at));
      list.slice(0, maxChips).forEach((b) => {
        const ch = el("button", "chip");
        ch.type = "button";
        ch.style.background = colorOf(b.person);
        ch.textContent = `${hm(new Date(b.starts_at))} ${b.person}`;
        ch.onclick = (e) => { e.stopPropagation(); openModal(b); };
        c.append(ch);
      });
      if (list.length > maxChips) c.append(Object.assign(el("div", "more"), { textContent: `+${list.length - maxChips} další` }));
      c.onclick = () => { cursor = d; setView("day"); };
      mg.append(c);
    }
    main.append(mh, mg);
  }

  function renderLegend() {
    $("legend").innerHTML = PEOPLE.map((p) => `<span><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</span>`).join("");
    $("demo").textContent = remote ? "" : "Demo režim – rezervace se zatím ukládají jen v tomhle prohlížeči. Sdílení se zapne po napojení databáze.";
  }

  // ---------- interakce v mřížce ----------
  function colAt(x) {
    for (const c of document.querySelectorAll(".col")) {
      const r = c.getBoundingClientRect();
      if (x >= r.left && x < r.right) return c;
    }
    return null;
  }
  const yToMin = (col, y) => ((y - col.getBoundingClientRect().top) / hourPx()) * 60;
  const snap = (m, f = Math.round) => f(m / SNAP) * SNAP;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // tažením po prázdném místě se vytvoří nová rezervace, ťuknutím 1h rezervace
  function attachCreate(col) {
    col.addEventListener("pointerdown", (e) => {
      if (e.target !== col || e.button > 0) return;
      const touch = e.pointerType === "touch";
      const m0 = clamp(snap(yToMin(col, e.clientY), Math.floor), 0, DAY_MIN - SNAP);
      const x0 = e.clientX, y0 = e.clientY;
      let ghost = null, range = null, cancelled = false;

      const move = (ev) => {
        if (touch) return; // na mobilu tah = scroll
        if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 5) return;
        busy = true;
        if (!ghost) { ghost = el("div", "ghost"); col.append(ghost); }
        const m1 = clamp(snap(yToMin(col, ev.clientY), Math.ceil), 0, DAY_MIN);
        const s = Math.min(m0, m1), en = Math.max(m0 + SNAP, m1);
        range = [s, en];
        ghost.style.top = `calc(var(--hour) * ${s / 60})`;
        ghost.style.height = `calc(var(--hour) * ${(en - s) / 60} - 2px)`;
        const d = parseYmd(col.dataset.date);
        ghost.textContent = `${hm(atMin(d, s))}–${hm(atMin(d, en))}`;
      };
      const cancel = () => { cancelled = true; cleanup(); };
      const up = () => {
        cleanup();
        if (cancelled) return;
        const d = parseYmd(col.dataset.date);
        let s, en;
        if (range) [s, en] = range;
        else { s = clamp(Math.floor(m0 / 30) * 30, 0, DAY_MIN - 60); en = s + 60; }
        openModal(null, atMin(d, s), atMin(d, en));
        ghost?.remove();
        busy = false;
      };
      const cleanup = () => {
        removeEventListener("pointermove", move);
        removeEventListener("pointerup", up);
        removeEventListener("pointercancel", cancel);
        if (cancelled) { ghost?.remove(); busy = false; }
      };
      addEventListener("pointermove", move);
      addEventListener("pointerup", up);
      addEventListener("pointercancel", cancel);
    });
  }

  // přesun rezervace (i mezi dny) a změna délky za spodní okraj
  function attachDrag(ev, b) {
    ev.addEventListener("pointerdown", (e) => {
      if (e.button > 0) return;
      e.stopPropagation();
      e.preventDefault();
      const resize = e.target.classList.contains("rs");
      const os = new Date(b.starts_at), oe = new Date(b.ends_at);
      const sMin = minsOf(os), dur = (oe - os) / 60000;
      const x0 = e.clientX, y0 = e.clientY;
      let moved = false, ns = os, ne = oe;

      const move = (m) => {
        if (!moved && Math.hypot(m.clientX - x0, m.clientY - y0) < 5) return;
        moved = true; busy = true;
        ev.classList.add("dragging");
        const delta = snap(((m.clientY - y0) / hourPx()) * 60);
        if (resize) {
          const eMin = clamp(sMin + dur + delta, sMin + SNAP, DAY_MIN);
          ns = os; ne = atMin(os, eMin);
          placeEvent(ev, sMin, eMin);
        } else {
          const col = colAt(m.clientX) || ev.parentElement;
          if (col !== ev.parentElement) col.append(ev);
          const d = parseYmd(col.dataset.date);
          const st = clamp(sMin + delta, 0, DAY_MIN - dur);
          ns = atMin(d, st); ne = new Date(ns.getTime() + dur * 60000);
          placeEvent(ev, st, st + dur);
        }
        fillEvent(ev, b.person, ns, ne, b.note);
      };
      const up = async () => {
        removeEventListener("pointermove", move);
        removeEventListener("pointerup", up);
        removeEventListener("pointercancel", up);
        ev.classList.remove("dragging");
        busy = false;
        if (!moved) return openModal(b);
        if (+ns === +os && +ne === +oe) return render();
        const c = conflictWith(ns, ne, b.id);
        if (c) { toast(conflictMsg(c)); return render(); }
        await save(b.id, { starts_at: ns.toISOString(), ends_at: ne.toISOString() });
      };
      addEventListener("pointermove", move);
      addEventListener("pointerup", up);
      addEventListener("pointercancel", up);
    });
  }

  // ---------- modal ----------
  let chosen = null;

  function openModal(b, start, end) {
    editing = b;
    if (b) { start = new Date(b.starts_at); end = new Date(b.ends_at); }
    if (!start) {
      const n = new Date();
      const base = view === "day" || sameDay(cursor, sod(n)) ? (sameDay(cursor, sod(n)) ? n : cursor) : cursor;
      const m = sameDay(base, n) ? Math.ceil((minsOf(n) + 1) / 30) * 30 : 9 * 60;
      start = atMin(base, Math.min(m, DAY_MIN - 60));
      end = new Date(start.getTime() + 3600000);
    }
    chosen = b ? b.person : localGet("maserna-me") || null;
    $("mtitle").textContent = b ? "Upravit rezervaci" : "Nová rezervace";
    $("mdate").value = ymd(start);
    $("mfrom").value = hmInput(start);
    $("mto").value = hmInput(end);
    $("mnote").value = b?.note || "";
    $("mdel").style.display = b ? "" : "none";
    $("merr").textContent = "";
    renderPeople();
    $("backdrop").classList.add("open");
  }

  function closeModal() { $("backdrop").classList.remove("open"); editing = null; }

  function renderPeople() {
    const wrap = $("mpeople");
    wrap.innerHTML = "";
    for (const p of PEOPLE) {
      const btn = el("button", "person" + (chosen === p.name ? " on" : ""));
      btn.type = "button";
      btn.innerHTML = `<span class="dot" style="background:${p.color}"></span>${esc(p.name)}`;
      if (chosen === p.name) { btn.style.background = p.color; btn.style.borderColor = p.color; btn.querySelector(".dot").style.background = "#fff"; }
      btn.onclick = () => { chosen = p.name; renderPeople(); };
      wrap.append(btn);
    }
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = $("merr");
    if (!chosen) return (err.textContent = "Vyber, kdo si masérnu bere.");
    const d = parseYmd($("mdate").value);
    const [fh, fm] = $("mfrom").value.split(":").map(Number);
    const [th, tm] = $("mto").value.split(":").map(Number);
    const s = atMin(d, fh * 60 + fm);
    const en = th === 0 && tm === 0 ? addDays(d, 1) : atMin(d, th * 60 + tm);
    if (en <= s) return (err.textContent = "Konec musí být později než začátek.");
    // ověř kolize i mimo zrovna zobrazený rozsah
    try {
      const around = await store.list(s, en);
      const c = around.find((x) => x.id !== editing?.id);
      if (c) return (err.textContent = conflictMsg(c));
    } catch {}
    localSet("maserna-me", chosen);
    const data = { person: chosen, note: $("mnote").value.trim() || null, starts_at: s.toISOString(), ends_at: en.toISOString() };
    const id = editing?.id;
    if (await save(id, data)) {
      closeModal();
      toast(id ? "Rezervace upravena." : "Masérna je zarezervovaná.");
    }
  });

  $("mdel").onclick = async () => {
    if (!editing || !confirm(`Smazat rezervaci – ${editing.person}?`)) return;
    try {
      await store.remove(editing.id);
      bookings = bookings.filter((b) => b.id !== editing.id);
      closeModal();
      render();
      toast("Rezervace smazána.");
    } catch (e) { $("merr").textContent = "Smazání selhalo: " + e.message; }
  };
  $("mcancel").onclick = closeModal;
  $("backdrop").addEventListener("pointerdown", (e) => { if (e.target === $("backdrop")) closeModal(); });

  // ---------- navigace ----------
  function setView(v) { view = v; localSet("maserna-view", v); lastScroll = null; load(); }
  function shift(dir) {
    if (view === "day") cursor = addDays(cursor, dir);
    else if (view === "week") cursor = addDays(cursor, 7 * dir);
    else cursor = new Date(cursor.getFullYear(), cursor.getMonth() + dir, 1);
    load();
  }
  $("prev").onclick = () => shift(-1);
  $("next").onclick = () => shift(1);
  $("today").onclick = () => { cursor = sod(new Date()); lastScroll = null; load(); };
  for (const b of document.querySelectorAll("#views button")) b.onclick = () => setView(b.dataset.v);
  $("add").onclick = $("fab").onclick = () => openModal(null);

  addEventListener("keydown", (e) => {
    if (e.key === "Escape") return closeModal();
    if ($("backdrop").classList.contains("open") || e.target.matches("input")) return;
    if (e.key === "ArrowLeft") shift(-1);
    if (e.key === "ArrowRight") shift(1);
    if (e.key === "t") $("today").click();
    if (e.key === "d") setView("day");
    if (e.key === "w") setView("week");
    if (e.key === "m") setView("month");
  });

  // ---------- pomocné ----------
  function el(tag, cls) { const x = document.createElement(tag); if (cls) x.className = cls; return x; }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
  let toastT;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 3500);
  }

  // ---------- start + průběžná synchronizace ----------
  renderLegend();
  load();
  setInterval(() => { if (!busy && !document.hidden) load(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  // posun čáry „teď" každou minutu
  setInterval(() => {
    const n = document.querySelector(".now");
    if (n) n.style.top = `calc(var(--hour) * ${minsOf(new Date()) / 60})`;
  }, 60000);
})();
</script>
</body>
</html>
